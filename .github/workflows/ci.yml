name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで新しい push があったら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint / 型チェック / テスト / ビルド / E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Dockerfile(node:22-alpine)と同じメジャーバージョン
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package.json の packageManager(pnpm@x.y.z)と同じ版を入れる。
      # Dockerfile と同じく npm で入れる(Corepack は Node 25 以降に同梱されないため使わない)
      - name: pnpm を用意
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      # pnpm のストア(パッケージの実体の置き場)をロックファイル単位でキャッシュする
      - name: pnpm のストアの場所
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: 型チェック
        run: pnpm typecheck

      - name: ユニットテスト
        run: pnpm test

      - name: ビルド
        run: pnpm build

      - name: Playwright のブラウザを用意
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E テスト
        run: pnpm e2e
        env:
          CI: "true"

      - name: E2E の結果を保存(失敗時)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
