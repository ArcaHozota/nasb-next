name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで新しい push があったら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint / 型チェック / テスト / ビルド / E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Dockerfile(node:22-alpine)と同じメジャーバージョン
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: 型チェック
        run: npm run typecheck

      - name: ユニットテスト
        run: npm test

      - name: ビルド
        run: npm run build

      - name: Playwright のブラウザを用意
        run: npx playwright install --with-deps chromium

      - name: E2E テスト
        run: npm run e2e
        env:
          CI: "true"

      - name: E2E の結果を保存(失敗時)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
